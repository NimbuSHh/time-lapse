<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Time-lapse · 视频确认与全尺寸导出</title><link rel="stylesheet" href="/refine.css"><script src="/trajectory.js" defer></script></head>
<body><main><a class="back" href="/">← 返回工作台、选择新素材或使用手动功能</a><p class="eyebrow">TIME-LAPSE</p><h1>视频确认与全尺寸导出</h1><p class="intro">保留自然光变化，先看完整视频，再确认交付。</p><p class="muted">全程处理工作副本，原 RAW 和原 XMP 保留。新素材从工作台直接开始。</p>
<section><div class="status-line"><h2 id="state">正在读取任务</h2><span id="count"></span></div><p id="phase"></p><progress id="progress" max="1" aria-label="当前阶段进度"></progress><p id="message" role="status"></p><p id="error" class="error" hidden></p><div class="actions"><button id="start" disabled>生成 / 继续完整预览</button><button id="stop" class="secondary" hidden>停止并保留进度</button></div></section>
<section id="resultPanel" hidden><h2 id="resultHeading">待确认的完整视频</h2><p id="outcome"></p><p id="videoSummary"></p><button id="loadVideo">载入完整视频</button><video id="video" controls playsinline preload="metadata" width="100%" hidden aria-label="完整修正预览视频"></video><p id="reviewNote" class="muted"></p><label><input id="reviewed" type="checkbox" disabled> 我已完整观看这版视频，确认亮度变化和画面效果，可以导出全尺寸</label><div class="actions"><button id="export" disabled>确认并导出全尺寸 JPG 与 XMP</button></div><p id="delivery" style="overflow-wrap:anywhere" role="status"></p></section>
</main></body></html>
